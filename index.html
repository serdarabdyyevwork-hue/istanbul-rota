<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İstanbul Rota</title>
<meta name="description" content="İstanbul için hazır gezi rotaları, internetsiz harita, ulaşım ücreti hesaplayıcı ve semt pazarları.">
<meta name="theme-color" content="#0B5563">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İstanbul Rota">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: the map fills the screen; a bottom sheet (peek / half / full) holds routes, transport,
   markets, place cards and settings. Colours come from the palette tokens that app.js sets on :root;
   the values below are the Boğaz light palette so the first paint is right. */
:root {
  --bg: #F2F7F6; --surface: #FFFFFF; --ink: #0E2A2F; --muted: #557072;
  --primary: #0B5563; --on-primary: #FFFFFF; --accent: #E07A5F;
  --line: #D5E4E1; --soft: #E3F0ED; --warn-bg: #FFF4E0; --warn-ink: #7A4A06;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); overflow: hidden; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#map { position: fixed; inset: 0; background: var(--soft); }
.maplibregl-ctrl-top-right, .maplibregl-ctrl-top-left { top: calc(var(--top) + 64px); }
.maplibregl-popup-content { color: #12233D; }

.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(var(--top) + 10px) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 700; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.brand img { width: 30px; height: 30px; border-radius: 50%; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--primary); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.icon-btn svg { width: 20px; height: 20px; }
.chip-off { background: var(--warn-bg); color: var(--warn-ink); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.12); }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); color: var(--ink); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.18);
  display: flex; flex-direction: column; height: 50vh; height: 50dvh; transition: height .25s ease; padding-bottom: var(--bottom); max-width: 720px; margin: 0 auto; }
.sheet[data-size="peek"] { height: calc(150px + var(--bottom)); }
.sheet[data-size="full"] { height: calc(100vh - 72px - var(--top)); height: calc(100dvh - 72px - var(--top)); }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.handle { border: 0; background: transparent; padding: 10px 0 4px; cursor: pointer; display: grid; place-items: center; }
.handle span { width: 44px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px max(12px, env(safe-area-inset-left, 0px)) 8px; border-bottom: 1px solid var(--line); }
.tabs a { text-align: center; text-decoration: none; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 6px 2px; border-radius: 10px; display: grid; gap: 2px; justify-items: center; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a[aria-current="page"] { color: var(--primary); background: var(--soft); }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.head h2 { font-size: 22px; font-weight: 800; }
.head p { color: var(--muted); margin-top: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.meta span { font-size: 12.5px; background: var(--soft); border-radius: 8px; padding: 3px 9px; }

.stops { list-style: none; margin: 0; padding: 0; position: relative; }
.stops::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 4px; border-radius: 2px; background: var(--primary); opacity: .3; }
.stop { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding-bottom: 12px; }
.dot { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font: 700 12px var(--mono); position: relative; z-index: 1; }
.card { min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
button.card { width: 100%; text-align: left; cursor: pointer; }
.card h3 { font-size: 16.5px; }
.when { color: var(--muted); font-size: 12.5px; }
.card p { font-size: 14.5px; margin-top: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fact { font-size: 12.5px; border-radius: 6px; padding: 3px 8px; background: var(--soft); }
.fact.check { background: var(--warn-bg); color: var(--warn-ink); }
.leg { margin: 0 0 12px 42px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.leg::before { content: ""; width: 14px; height: 2px; background: var(--accent); flex: none; }

.panel { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field label, .label { font-weight: 600; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, input[type=number] { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
select { width: 100%; }
input[type=number] { width: 110px; }
input[type=range] { width: 100%; accent-color: var(--primary); }
.results { display: grid; gap: 10px; margin-top: 14px; }
.result { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.result strong { font-size: 16px; }
.result .amt { font: 700 21px var(--mono); text-align: right; }
.result .how { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.result.main { border: 2px solid var(--primary); }
.src { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.src a, .link { color: var(--primary); }

.today-line { font-size: 14px; margin: 10px 0; color: var(--muted); }
.market { display: grid; grid-template-columns: 70px 1fr; gap: 10px; margin-bottom: 10px; }
.day { border-radius: 12px; background: var(--soft); color: var(--primary); display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 13px; padding: 8px 4px; }
.day.today { background: var(--primary); color: var(--on-primary); }
.day.unknown { background: var(--warn-bg); color: var(--warn-ink); }
.where { color: var(--muted); font-size: 13px; }

.btn { border: 0; cursor: pointer; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--primary); color: var(--on-primary); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.ghost { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
.btn:disabled { opacity: .6; cursor: default; }
.back { display: block; border: 0; background: transparent; color: var(--primary); font-weight: 600; cursor: pointer; padding: 0 0 10px; }
.cat { display: inline-block; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; color: #fff; margin-bottom: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.section { margin-bottom: 22px; }
.section > h3 { font-size: 15px; margin-bottom: 10px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.swatch { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 8px; cursor: pointer; display: grid; gap: 6px; justify-items: center; font-size: 13px; font-weight: 600; }
.swatch[aria-pressed="true"] { border-color: var(--primary); }
.swatch .dots { display: flex; gap: 3px; }
.swatch .dots i { width: 16px; height: 16px; border-radius: 50%; display: block; border: 1px solid rgba(0,0,0,.12); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.package { border: 2px solid var(--primary); border-radius: 16px; padding: 14px; display: grid; gap: 6px; background: var(--bg); }
.package .price { font: 800 26px var(--font); color: var(--primary); }
.status { font-size: 14px; }
.status.saved { color: var(--primary); font-weight: 600; }
textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 80px; resize: vertical; }
.ok { color: var(--primary); font-weight: 600; font-size: 14px; margin-top: 8px; }
.error { background: var(--warn-bg); color: var(--warn-ink); padding: 14px; border-radius: 12px; }
.seg.two { grid-template-columns: repeat(2, 1fr); margin-bottom: 14px; }
.filters { display: grid; gap: 10px; margin-bottom: 14px; }
.chip.small { padding: 5px 11px; font-size: 13px; }
.plist { display: grid; gap: 8px; }
.pitem { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 14px; }
.pitem .open { border: 0; background: transparent; text-align: left; padding: 0; cursor: pointer; min-width: 0; }
.pitem h3 { font-size: 15.5px; }
.add { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); background: transparent; color: var(--primary); font: 700 20px var(--font); cursor: pointer; display: grid; place-items: center; }
.add[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.badge { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--soft); color: var(--primary); margin-left: 6px; vertical-align: 1px; }
.starts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.starts input { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.pstop { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: start; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.pstop .time { font: 700 14px var(--mono); color: var(--primary); }
.pstop .time small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.pstop h3 { font-size: 15.5px; }
.pstop .tools { display: flex; flex-direction: column; gap: 4px; }
.tool { width: 32px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; line-height: 1; }
.pleg { margin: 6px 0 6px 66px; font-size: 13px; color: var(--muted); }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin-top: 6px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.summary div { background: var(--soft); border-radius: 12px; padding: 8px 10px; }
.summary b { display: block; font: 700 17px var(--mono); }
.summary span { font-size: 12px; color: var(--muted); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.lang button { border: 0; background: transparent; padding: 8px 11px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Harita"></div>

<header class="topbar">
  <div class="brand"><img src="icons/icon-192.png" alt=""><span>İstanbul Rota</span></div>
  <div class="top-actions">
    <span class="chip-off" id="offline" hidden></span>
    <div class="lang" role="group" aria-label="Dil / Language">
      <button id="lang-tr" type="button" aria-pressed="true">TR</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
    <button class="icon-btn" id="locate" type="button" aria-label="Konumumu göster">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
    </button>
  </div>
</header>

<section class="sheet" id="sheet" data-size="half" aria-label="Bilgi paneli">
  <button class="handle" id="handle" type="button" aria-label="Paneli büyüt veya küçült"><span></span></button>
  <nav class="tabs" aria-label="Bölümler">
    <a href="#rotalar" id="tab-rotalar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18h6a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7h6"/></svg><span></span></a>
    <a href="#plan" id="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"/></svg><span></span></a>
    <a href="#ulasim" id="tab-ulasim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M4 11h16M8 19l-1 2M16 19l1 2"/></svg><span></span></a>
    <a href="#pazarlar" id="tab-pazarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9h18l-2-5H5L3 9Z"/><path d="M5 9v11h14V9M9 20v-6h6v6"/></svg><span></span></a>
    <a href="#ayarlar" id="tab-ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span></span></a>
  </nav>
  <div class="sheet-body" id="sheet-body">
    <div id="load-error" class="error" hidden></div>

    <section id="view-rotalar">
      <div class="seg two" id="explore-seg" role="group">
        <button type="button" data-mode="paket"></button>
        <button type="button" data-mode="kesfet"></button>
      </div>
      <div id="mode-paket">
        <div class="chips" id="route-chips" role="group"></div>
        <div id="route"></div>
      </div>
      <div id="mode-kesfet" hidden>
        <div class="filters">
          <div class="chips" id="cat-chips" role="group" style="margin-bottom:0"></div>
          <div class="row">
            <button type="button" class="chip small" id="free-chip" aria-pressed="false"></button>
            <select id="explore-district" style="flex:1"></select>
          </div>
        </div>
        <div class="plist" id="explore-list"></div>
      </div>
    </section>

    <section id="view-plan" hidden>
      <div class="field" style="margin-bottom:10px">
        <span class="label" id="t-plan-start"></span>
        <div class="starts">
          <button type="button" class="chip small" data-start="now"></button>
          <button type="button" class="chip small" data-start="tomorrow"></button>
          <input type="datetime-local" id="plan-custom" aria-label="Başlangıç zamanı">
        </div>
      </div>
      <div id="plan-body"></div>
    </section>

    <section id="view-ulasim" hidden>
      <div class="panel">
        <div class="field"><label for="from" id="t-from"></label><select id="from"></select></div>
        <div class="field"><label for="to" id="t-to"></label><select id="to"></select></div>
        <div class="field"><label for="km"><span id="t-km"></span>: <span class="mono" id="km-val"></span> km</label><input type="range" id="km" min="1" max="80" step="1" value="6"></div>
        <div class="field"><label for="wait"><span id="t-wait"></span>: <span class="mono" id="wait-val"></span> <span id="t-min"></span></label><input type="range" id="wait" min="0" max="60" step="5" value="10"></div>
        <div class="field"><label for="fuel" id="t-fuel"></label><div class="row"><input type="number" id="fuel" min="1" step="0.5"><span class="mono">TL / L</span><span id="t-fuel-note" class="where"></span></div></div>
      </div>
      <div class="results" id="results"></div>
      <p class="src" id="fare-src"></p>
    </section>

    <section id="view-pazarlar" hidden>
      <div class="field"><label for="district" id="t-district"></label><select id="district"></select></div>
      <p class="today-line" id="today-line"></p>
      <div id="markets"></div>
    </section>

    <section id="view-yer" hidden></section>

    <section id="view-ayarlar" hidden>
      <div class="section">
        <h3 id="t-look"></h3>
        <p class="label" id="t-palette" style="margin-bottom:8px"></p>
        <div class="swatches" id="swatches"></div>
        <p class="label" id="t-theme" style="margin:14px 0 8px"></p>
        <div class="seg" id="theme-seg" role="group">
          <button type="button" data-theme="auto"></button>
          <button type="button" data-theme="light"></button>
          <button type="button" data-theme="dark"></button>
        </div>
      </div>
      <div class="section">
        <h3 id="t-offline-map"></h3>
        <div class="panel">
          <p class="status" id="map-status"></p>
          <div class="row">
            <button class="btn" id="map-download" type="button"></button>
            <button class="btn ghost" id="map-remove" type="button" hidden></button>
          </div>
        </div>
      </div>
      <div class="section">
        <h3 id="t-package"></h3>
        <div class="package">
          <p class="label" id="t-package-name"></p>
          <p class="price">699 TL</p>
          <p class="where" id="t-package-note"></p>
        </div>
      </div>
      <div class="section">
        <h3 id="t-install-h"></h3>
        <button class="btn" id="install" type="button" hidden></button>
        <p class="where" id="install-hint"></p>
      </div>
      <div class="section" id="report-section">
        <h3 id="t-report-h"></h3>
        <form id="report-form">
          <label for="report-text" id="t-report-label" class="label" style="display:block;margin-bottom:6px"></label>
          <textarea id="report-text"></textarea>
          <div class="row" style="margin-top:10px">
            <button class="btn" type="submit" id="t-report-send"></button>
            <button class="btn ghost" type="button" id="report-copy"></button>
          </div>
          <p class="ok" id="report-ok" hidden></p>
        </form>
      </div>
      <p class="where" id="about"></p>
    </section>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js"></script>
<script src="app.js"></script>
</body>
</html>
